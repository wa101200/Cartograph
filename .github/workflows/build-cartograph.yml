name: Build Cartograph

on:
  push:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cartograph-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-runner:
    runs-on: ubuntu-latest
    steps:
      - name: Check 16-core runner readiness
        env:
          RUNNER_READY: ${{ vars.WINDOWS_16_CORE_READY }}
        run: |
          if [ "$RUNNER_READY" != "true" ]; then
            echo '::error::The 16-core hosted Windows runner is not enabled. Configure the organization runner and billing, then run scripts/setup-hosted-runner.py. See BUILDING.md.'
            exit 1
          fi

  build:
    needs: check-runner
    # This is an organization-configured GitHub-hosted runner name, not a
    # standard label that GitHub automatically provisions.
    runs-on: cartograph-windows-16core
    timeout-minutes: 360
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          path: project

      - name: Check dependency credentials
        env:
          GH_TOKEN: ${{ secrets.CSS_ENGINE_TOKEN }}
          WWISE_EMAIL: ${{ secrets.WWISE_EMAIL }}
          WWISE_PASSWORD: ${{ secrets.WWISE_PASSWORD }}
        run: |
          $missing = @()
          if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN)) { $missing += 'CSS_ENGINE_TOKEN' }
          if ([string]::IsNullOrWhiteSpace($env:WWISE_EMAIL)) { $missing += 'WWISE_EMAIL' }
          if ([string]::IsNullOrWhiteSpace($env:WWISE_PASSWORD)) { $missing += 'WWISE_PASSWORD' }
          if ($missing.Count -gt 0) {
            throw "Add repository Actions secrets: $($missing -join ', '). CSS_ENGINE_TOKEN needs authorized access to satisfactorymodding/UnrealEngine; the default GITHUB_TOKEN cannot access that private repository."
          }
          gh api repos/satisfactorymodding/UnrealEngine --jq '.full_name'
          if ($LASTEXITCODE -ne 0) { throw 'CSS_ENGINE_TOKEN does not have access to the custom engine repository.' }

      - name: Download and extract CSS Unreal Engine
        env:
          GH_TOKEN: ${{ secrets.CSS_ENGINE_TOKEN }}
          ENGINE_RELEASE: ${{ vars.CSS_ENGINE_RELEASE }}
        run: |
          $engineRoot = Join-Path $env:RUNNER_TEMP 'ue'
          New-Item -ItemType Directory -Force -Path $engineRoot | Out-Null
          $arguments = @('release', 'download', '--repo', 'satisfactorymodding/UnrealEngine',
            '--pattern', 'UnrealEngine-CSS-Editor-Win64.7z.*', '--dir', $engineRoot)
          if (![string]::IsNullOrWhiteSpace($env:ENGINE_RELEASE)) { $arguments += $env:ENGINE_RELEASE }
          gh @arguments
          if ($LASTEXITCODE -ne 0) { throw 'Engine download failed. Check CSS_ENGINE_RELEASE and availability of the Windows editor archive.' }
          $firstPart = Join-Path $engineRoot 'UnrealEngine-CSS-Editor-Win64.7z.001'
          if (!(Test-Path $firstPart)) { throw 'The Windows editor split archive was not found.' }
          & 7z x $firstPart "-o$engineRoot" -y
          if ($LASTEXITCODE -ne 0) { throw 'Engine extraction failed; check the runner disk-space and archive format.' }
          # Remove only downloaded archive parts, after successful extraction.
          Get-ChildItem $engineRoot -Filter 'UnrealEngine-CSS-Editor-Win64.7z.*' -File | Remove-Item
          $version = Get-Content (Join-Path $engineRoot 'Engine\Build\Build.version') -Raw | ConvertFrom-Json
          if ($version.MajorVersion -ne 5 -or $version.MinorVersion -ne 6 -or $version.PatchVersion -ne 1) {
            throw 'Downloaded engine is not 5.6.1. Set CSS_ENGINE_RELEASE to the matching CSS release tag.'
          }
          # wwise-cli resolves EngineAssociation through Unreal's user registry.
          # Register explicitly, without launching the interactive editor.
          $registryPath = 'HKCU:\Software\Epic Games\Unreal Engine\Builds'
          New-Item -Path $registryPath -Force | Out-Null
          New-ItemProperty -Path $registryPath -Name '5.6.1-CSS' -Value $engineRoot -PropertyType String -Force | Out-Null
          "UE_CSS_ROOT=$engineRoot" >> $env:GITHUB_ENV
          Get-PSDrive -PSProvider FileSystem | Select-Object Name,Used,Free

      - name: Download and integrate Wwise
        working-directory: project
        env:
          GH_TOKEN: ${{ github.token }}
          WWISE_EMAIL: ${{ secrets.WWISE_EMAIL }}
          WWISE_PASSWORD: ${{ secrets.WWISE_PASSWORD }}
        run: |
          $cli = Join-Path $env:RUNNER_TEMP 'wwise-cli.exe'
          gh release download v0.2.4 --repo mircearoata/wwise-cli --pattern wwise-cli_windows_amd64.exe --output $cli
          if ($LASTEXITCODE -ne 0) { throw 'wwise-cli download failed.' }
          # Do not log signed download URLs or account authentication output.
          & $cli download --sdk-version '2023.1.14.8770' --filter Packages=SDK `
            --filter DeploymentPlatforms=Windows_vc160 --filter DeploymentPlatforms=Windows_vc170 `
            --filter DeploymentPlatforms= > $null
          if ($LASTEXITCODE -ne 0) { throw 'Wwise SDK download failed.' }
          & $cli integrate-ue --integration-version '2023.1.14.3555' --project (Join-Path $PWD 'FactoryGame.uproject') > $null
          if ($LASTEXITCODE -ne 0) { throw 'Wwise project integration failed.' }
          if (!(Test-Path (Join-Path $PWD 'Plugins\Wwise\Wwise.uplugin'))) {
            throw 'Wwise integration did not create Plugins/Wwise/Wwise.uplugin.'
          }
          if (!(Test-Path (Join-Path $PWD 'Plugins\WwiseNiagara\WwiseNiagara.uplugin'))) {
            throw 'Wwise integration did not create Plugins/WwiseNiagara/WwiseNiagara.uplugin.'
          }

      - name: Build editor target
        working-directory: project
        run: |
          $projectFile = Join-Path $PWD 'FactoryGame.uproject'
          $buildScript = Join-Path $env:UE_CSS_ROOT 'Engine\Build\BatchFiles\Build.bat'
          & $buildScript FactoryEditor Win64 Development "-project=$projectFile" -WaitMutex
          if ($LASTEXITCODE -ne 0) {
            throw "FactoryEditor build failed with exit code $LASTEXITCODE"
          }

      - name: Package Cartograph Windows client
        working-directory: project
        run: |
          $projectFile = Join-Path $PWD 'FactoryGame.uproject'
          $uatScript = Join-Path $env:UE_CSS_ROOT 'Engine\Build\BatchFiles\RunUAT.bat'
          & $uatScript "-ScriptsForProject=$projectFile" PackagePlugin "-project=$projectFile" `
            '-clientconfig=Shipping' '-serverconfig=Shipping' '-DLCName=Cartograph' `
            '-build' '-platform=Win64' '-nocompileeditor' '-installed' '-merge'
          if ($LASTEXITCODE -ne 0) {
            throw "Cartograph packaging failed with exit code $LASTEXITCODE"
          }

          $archiveRoot = Join-Path $PWD 'Saved\ArchivedPlugins'
          $packages = Get-ChildItem $archiveRoot -Filter '*.zip' -File -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match 'Cartograph' } |
            Sort-Object LastWriteTime -Descending
          if (!$packages) {
            throw "No Cartograph package ZIP was produced under '$archiveRoot'."
          }

          $artifactDirectory = Join-Path $PWD 'artifacts'
          New-Item -ItemType Directory -Force -Path $artifactDirectory | Out-Null
          Copy-Item $packages[0].FullName (Join-Path $artifactDirectory 'Cartograph-Windows.zip') -Force
          Get-Item (Join-Path $artifactDirectory 'Cartograph-Windows.zip') | Format-List FullName,Length

      - name: Upload packaged mod
        uses: actions/upload-artifact@v7
        with:
          name: Cartograph-Windows-${{ github.run_number }}
          path: project/artifacts/Cartograph-Windows.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
