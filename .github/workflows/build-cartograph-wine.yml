name: Build Cartograph (Linux Wine)

on:
  push:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cartograph-wine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ vars.CARTOGRAPH_LINUX_RUNNER || 'blacksmith-32vcpu-ubuntu-2404' }}
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      CI_CACHE_ROOT: /tmp/cg-cache
      CARTOGRAPH_BUILD_ROOT: /tmp/cg-cache
      PROJECT_ROOT: /tmp/cg
      UE_CSS_ROOT: /tmp/cg-cache/ue
      WINEPREFIX: /tmp/cg-wine-prefix
      WINEARCH: win64
      WINEDEBUG: -all
      NUGET_PACKAGES: /tmp/cg-cache/nuget
      ENGINE_RELEASE: ${{ vars.CSS_ENGINE_RELEASE || '5.6.1-css-83' }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Validate cache synchronization and stall detection
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: Check dependency credentials
        env:
          GH_TOKEN: ${{ secrets.CSS_ENGINE_TOKEN }}
          WWISE_EMAIL: ${{ secrets.WWISE_EMAIL }}
          WWISE_PASSWORD: ${{ secrets.WWISE_PASSWORD }}
        run: |
          for name in GH_TOKEN WWISE_EMAIL WWISE_PASSWORD; do
            if [ -z "${!name}" ]; then echo "::error::Missing credential: $name"; exit 1; fi
          done
          gh api repos/satisfactorymodding/UnrealEngine --jq '.full_name'
      - name: Compute cache keys
        id: keys
        env:
          INPUTS: ${{ hashFiles('.github/ci-packages.txt', '.github/scripts/setup-ci-*.sh') }}
          ABI: ${{ hashFiles('FactoryGame.uproject', 'Source/*.Target.cs', 'Config/**', 'Mods/**/*.uplugin') }}
        run: |
          tools=$(printf '%s' "native-v2-$ENGINE_RELEASE-$INPUTS" | sha256sum | cut -c1-24)
          echo "tools=$tools" >> "$GITHUB_OUTPUT"
          echo "outputs=$(printf '%s' "$tools-$GITHUB_REF-$ABI" | sha256sum | cut -c1-24)" >> "$GITHUB_OUTPUT"
          echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - name: Restore native toolchains and caches
        uses: useblacksmith/stickydisk@3f6be1451e3cad893b778bc93495c80452a5da26 # v1
        with:
          key: cartograph-${{ github.repository_id }}-tools-${{ steps.keys.outputs.tools }}
          path: /tmp/cg-cache
          commit: on-change
      - name: Restore incremental project outputs
        uses: useblacksmith/stickydisk@3f6be1451e3cad893b778bc93495c80452a5da26 # v1
        with:
          key: cartograph-${{ github.repository_id }}-build-${{ steps.keys.outputs.outputs }}
          path: /tmp/cg
          commit: on-change
      - name: Restore APT downloads
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/cartograph-apt
          key: apt-ubuntu2404-${{ steps.keys.outputs.month }}-${{ hashFiles('.github/ci-packages.txt') }}
          restore-keys: apt-ubuntu2404-
      - name: Install Linux dependencies and synchronize source
        timeout-minutes: 20
        run: |
          sudo chown "$(id -u):$(id -g)" "$CI_CACHE_ROOT" "$PROJECT_ROOT"
          mkdir -p "$RUNNER_TEMP/cartograph-apt/partial" "$NUGET_PACKAGES"
          mapfile -t packages < .github/ci-packages.txt
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            -o "Dir::Cache::archives=$RUNNER_TEMP/cartograph-apt" "${packages[@]}"
          bash .github/scripts/prepare-ci-project.sh
      - name: Restore or build patched Wine
        timeout-minutes: 45
        run: bash .github/scripts/setup-ci-wine.sh
      - name: Restore or install MSVC and Windows SDK
        timeout-minutes: 20
        run: bash .github/scripts/setup-ci-msvc.sh
      - name: Restore or download CSS engine (headless registration)
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ secrets.CSS_ENGINE_TOKEN }}
        run: bash .github/scripts/setup-ci-engine.sh
      - name: Restore or download and integrate Wwise
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ github.token }}
          WWISE_EMAIL: ${{ secrets.WWISE_EMAIL }}
          WWISE_PASSWORD: ${{ secrets.WWISE_PASSWORD }}
        run: bash .github/scripts/setup-ci-wwise.sh
      - name: Build and package natively using Wine/MSVC
        timeout-minutes: 65
        run: |
          python3 scripts/run-with-watchdog.py --idle-seconds 600 --max-seconds 3600 \
            -- bash "$PROJECT_ROOT/scripts/build-local.sh"
      - name: Upload packaged mod
        uses: actions/upload-artifact@v7
        with:
          name: Cartograph-Windows-Wine-${{ github.run_number }}
          path: /tmp/cg/Saved/ArchivedPlugins/Cartograph/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
      - name: Stop isolated Wine processes and summarize caches
        if: always()
        run: |
          wineserver -k 2>/dev/null || true
          du -sh "$CI_CACHE_ROOT" "$PROJECT_ROOT" 2>/dev/null || true
          if [ -L "$PROJECT_ROOT/.git" ]; then unlink "$PROJECT_ROOT/.git"; fi
