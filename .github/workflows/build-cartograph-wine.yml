name: Build Cartograph (Linux Wine)

on:
  push:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

# Serialize snapshots of the same branch's generated outputs. Different branches
# have separate output caches; toolchains are keyed by their pinned inputs.
concurrency:
  group: cartograph-wine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ vars.CARTOGRAPH_LINUX_RUNNER || 'blacksmith-32vcpu-ubuntu-2404' }}
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    env:
      CI_CACHE_ROOT: /tmp/cg-cache
      PROJECT_ROOT: /tmp/cg
      UE_CSS_ROOT: /tmp/cg-cache/ue
      WINEPREFIX: /tmp/cg-wine-prefix
      WINEARCH: win64
      WINEDEBUG: -all
      NUGET_PACKAGES: /tmp/cg-cache/nuget
      ENGINE_RELEASE: ${{ vars.CSS_ENGINE_RELEASE || '5.6.1-css-83' }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check dependency credentials before restoring toolchains
        env:
          GH_TOKEN: ${{ secrets.CSS_ENGINE_TOKEN }}
          WWISE_EMAIL: ${{ secrets.WWISE_EMAIL }}
          WWISE_PASSWORD: ${{ secrets.WWISE_PASSWORD }}
        run: |
          for name in GH_TOKEN WWISE_EMAIL WWISE_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing dependency credential: $name (GH_TOKEN comes from CSS_ENGINE_TOKEN)."
              exit 1
            fi
          done
          gh api repos/satisfactorymodding/UnrealEngine --jq '.full_name'

      - name: Compute cache keys
        id: keys
        env:
          TOOLCHAIN_INPUTS: ${{ hashFiles('.github/ci-packages.txt', '.github/scripts/setup-ci-*.sh') }}
          ABI_INPUTS: ${{ hashFiles('FactoryGame.uproject', 'Source/*.Target.cs', 'Config/**', 'Mods/**/*.uplugin') }}
        run: |
          toolchain=$(printf '%s' "ubuntu2404-x64-v1-$ENGINE_RELEASE-$TOOLCHAIN_INPUTS" | sha256sum | cut -c1-24)
          outputs=$(printf '%s' "v1-$toolchain-$GITHUB_REF-$ABI_INPUTS" | sha256sum | cut -c1-24)
          echo "toolchain=$toolchain" >> "$GITHUB_OUTPUT"
          echo "outputs=$outputs" >> "$GITHUB_OUTPUT"
          echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Restore engine, MSVC, Wwise, Wine and NuGet storage
        uses: useblacksmith/stickydisk@3f6be1451e3cad893b778bc93495c80452a5da26 # v1
        with:
          key: cartograph-${{ github.repository_id }}-tools-${{ steps.keys.outputs.toolchain }}
          path: /tmp/cg-cache
          commit: on-change

      - name: Restore incremental compiler and cooker outputs
        uses: useblacksmith/stickydisk@3f6be1451e3cad893b778bc93495c80452a5da26 # v1
        with:
          key: cartograph-${{ github.repository_id }}-build-${{ steps.keys.outputs.outputs }}
          path: /tmp/cg
          commit: on-change

      - name: Restore apt package downloads
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/cartograph-apt
          key: apt-ubuntu2404-${{ steps.keys.outputs.month }}-${{ hashFiles('.github/ci-packages.txt') }}
          restore-keys: |
            apt-ubuntu2404-

      - name: Install build dependencies from cached packages
        run: |
          sudo chown "$(id -u):$(id -g)" "$CI_CACHE_ROOT" "$PROJECT_ROOT"
          mkdir -p "$RUNNER_TEMP/cartograph-apt/partial" "$CI_CACHE_ROOT/ddc" "$NUGET_PACKAGES"
          mapfile -t packages < .github/ci-packages.txt
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            -o "Dir::Cache::archives=$RUNNER_TEMP/cartograph-apt" "${packages[@]}"
          echo "UE-LocalDataCachePath=$CI_CACHE_ROOT/ddc" >> "$GITHUB_ENV"

      - name: Restore or build patched Wine 11
        timeout-minutes: 90
        run: bash .github/scripts/setup-ci-wine.sh

      - name: Restore or install MSVC 17.8 and Windows SDK
        run: bash .github/scripts/setup-ci-msvc.sh

      - name: Synchronize inputs without invalidating cached timestamps
        run: bash .github/scripts/prepare-ci-project.sh

      - name: Restore or download and register CSS Unreal Engine
        env:
          GH_TOKEN: ${{ secrets.CSS_ENGINE_TOKEN }}
        run: bash .github/scripts/setup-ci-engine.sh

      - name: Restore or download and integrate Wwise
        env:
          GH_TOKEN: ${{ github.token }}
          WWISE_EMAIL: ${{ secrets.WWISE_EMAIL }}
          WWISE_PASSWORD: ${{ secrets.WWISE_PASSWORD }}
        run: bash .github/scripts/setup-ci-wwise.sh

      - name: Incrementally build Linux editor target
        run: |
          "$UE_CSS_ROOT/Engine/Build/BatchFiles/Linux/Build.sh" FactoryEditor Linux Development \
            "-project=$PROJECT_ROOT/FactoryGame.uproject" -NoUBA -NoDebugInfo "-MaxParallelActions=$(nproc)"

      - name: Incrementally package Windows Steam client
        run: |
          hard=$(ulimit -Hn)
          if [ "$hard" = unlimited ] || [ "$hard" -ge 1048576 ]; then
            ulimit -Sn 1048576
          else
            ulimit -Sn "$hard"
          fi
          "$UE_CSS_ROOT/Engine/Build/BatchFiles/RunUAT.sh" \
            "-ScriptsForProject=$PROJECT_ROOT/FactoryGame.uproject" PackagePlugin \
            "-project=$PROJECT_ROOT/FactoryGame.uproject" -DLCName=Cartograph \
            -Target=FactoryGameSteam -merge -build -clientconfig=Shipping -serverconfig=Shipping \
            -platform=Win64 -nocompileeditor -installed -ddc=InstalledNoZenLocalFallback
          test -f "$PROJECT_ROOT/Saved/ArchivedPlugins/Cartograph/Cartograph-Windows.zip"

      - name: Upload packaged mod
        uses: actions/upload-artifact@v7
        with:
          name: Cartograph-Windows-Wine-${{ github.run_number }}
          path: /tmp/cg/Saved/ArchivedPlugins/Cartograph/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Summarize persistent cache sizes
        if: always()
        run: |
          du -sh "$CI_CACHE_ROOT" "$PROJECT_ROOT" 2>/dev/null || true
          # Remove only our ephemeral Git link; actual checkout metadata isn't cached.
          if [ -L "$PROJECT_ROOT/.git" ]; then unlink "$PROJECT_ROOT/.git"; fi
