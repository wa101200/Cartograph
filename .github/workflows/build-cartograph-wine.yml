name: Build Cartograph (Linux Wine)

on:
  push:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cartograph-wine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Find the published dependency image
        id: image
        shell: bash
        run: |
          ref=$(bash scripts/docker-image-ref.sh)
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          if docker manifest inspect "$ref" >/dev/null 2>&1; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Restore Docker build layers
        if: steps.image.outputs.exists != 'true'
        uses: useblacksmith/setup-docker-builder@v2
        with:
          cache-key: cartograph-dependency-dockerfile
      - name: Publish dependency image only when inputs change
        if: steps.image.outputs.exists != 'true'
        id: publish
        uses: useblacksmith/build-push-action@v2
        with:
          context: docker
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.ref }}
          provenance: false
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: Pin the image digest for the build
        id: resolve
        shell: bash
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: |
          digest=$(docker manifest inspect --verbose "$IMAGE_REF" | jq -er '.Descriptor.digest')
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "ref=${IMAGE_REF%%:*}@$digest" >> "$GITHUB_OUTPUT"

  build:
    needs: image
    runs-on: ${{ vars.CARTOGRAPH_LINUX_RUNNER || 'blacksmith-32vcpu-ubuntu-2404' }}
    timeout-minutes: 360
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        shell: bash
    env:
      CI_CACHE_ROOT: /tmp/cg-cache
      CARTOGRAPH_BUILD_ROOT: /tmp/cg-cache
      PROJECT_ROOT: /tmp/cg
      UE_CSS_ROOT: /tmp/cg-cache/ue
      UE_WINE_MSVC: /tmp/cg-cache/msvc
      WINEPREFIX: /tmp/cg-cache/docker-wine-prefix
      WINEARCH: win64
      WINEDEBUG: -all
      NUGET_PACKAGES: /tmp/cg-cache/nuget
      ENGINE_RELEASE: ${{ vars.CSS_ENGINE_RELEASE || '5.6.1-css-83' }}
      CARTOGRAPH_DOCKER_IMAGE: ${{ needs.image.outputs.ref }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate scripts and incremental-cache behavior
        run: |
          python3 scripts/tests/test-build-local.py
          python3 scripts/tests/test-ci-cache.py

      - name: Check dependency credentials
        env:
          GH_TOKEN: ${{ secrets.CSS_ENGINE_TOKEN }}
          WWISE_EMAIL: ${{ secrets.WWISE_EMAIL }}
          WWISE_PASSWORD: ${{ secrets.WWISE_PASSWORD }}
        run: |
          for name in GH_TOKEN WWISE_EMAIL WWISE_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing dependency credential: $name."
              exit 1
            fi
          done
          gh api repos/satisfactorymodding/UnrealEngine --jq '.full_name'

      - name: Compute toolchain and incremental-output cache keys
        id: keys
        env:
          TOOLCHAIN_INPUTS: ${{ hashFiles('docker/**', '.github/scripts/setup-ci-*.sh') }}
          ABI_INPUTS: ${{ hashFiles('FactoryGame.uproject', 'Source/*.Target.cs', 'Config/**', 'Mods/**/*.uplugin') }}
        run: |
          toolchain=$(printf '%s' "docker-x64-v2-$ENGINE_RELEASE-$TOOLCHAIN_INPUTS" | sha256sum | cut -c1-24)
          outputs=$(printf '%s' "v2-$toolchain-$GITHUB_REF-$ABI_INPUTS" | sha256sum | cut -c1-24)
          echo "toolchain=$toolchain" >> "$GITHUB_OUTPUT"
          echo "outputs=$outputs" >> "$GITHUB_OUTPUT"

      - name: Restore engine, MSVC, Wwise, NuGet and cooking cache
        uses: useblacksmith/stickydisk@3f6be1451e3cad893b778bc93495c80452a5da26 # v1
        with:
          key: cartograph-${{ github.repository_id }}-tools-${{ steps.keys.outputs.toolchain }}
          path: /tmp/cg-cache
          commit: on-change

      - name: Restore incremental compiler and cooker outputs
        uses: useblacksmith/stickydisk@3f6be1451e3cad893b778bc93495c80452a5da26 # v1
        with:
          key: cartograph-${{ github.repository_id }}-build-${{ steps.keys.outputs.outputs }}
          path: /tmp/cg
          commit: on-change

      - name: Set ownership of cache mount roots
        run: sudo chown "$(id -u):$(id -g)" "$CI_CACHE_ROOT" "$PROJECT_ROOT"

      - name: Authenticate to the dependency-image registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull shared dependency image (Blacksmith caches Docker images)
        run: docker pull "$CARTOGRAPH_DOCKER_IMAGE"

      - name: Restore or provision toolchains inside Docker
        env:
          GH_TOKEN: ${{ secrets.CSS_ENGINE_TOKEN }}
          WWISE_EMAIL: ${{ secrets.WWISE_EMAIL }}
          WWISE_PASSWORD: ${{ secrets.WWISE_PASSWORD }}
        run: bash .github/scripts/run-ci-container.sh

      - name: Build and package using the local Docker entrypoint
        run: bash "$PROJECT_ROOT/scripts/build-local.sh"

      - name: Upload packaged mod
        uses: actions/upload-artifact@v7
        with:
          name: Cartograph-Windows-Wine-${{ github.run_number }}
          path: /tmp/cg/Saved/ArchivedPlugins/Cartograph/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Summarize persistent cache sizes
        if: always()
        run: |
          du -sh "$CI_CACHE_ROOT" "$PROJECT_ROOT" 2>/dev/null || true
          if [ -L "$PROJECT_ROOT/.git" ]; then unlink "$PROJECT_ROOT/.git"; fi
