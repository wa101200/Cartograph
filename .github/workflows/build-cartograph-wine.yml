name: Build Cartograph (Linux Wine)

on:
  push:
    paths-ignore:
      - .github/workflows/build-cartograph.yml
      - scripts/setup-hosted-runner.py
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cartograph-wine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Blacksmith's confirmed standard Linux catalog currently tops out at 32 vCPU.
    # Override only after a custom larger runner label is available.
    runs-on: ${{ vars.CARTOGRAPH_LINUX_RUNNER || 'blacksmith-32vcpu-ubuntu-2404' }}
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    env:
      WINEPREFIX: /tmp/cg-wine-prefix
      WINEARCH: win64
      WINEDEBUG: -all
      PROJECT_ROOT: /tmp/cg
      UE_CSS_ROOT: /tmp/cg-ue

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check dependency credentials
        env:
          GH_TOKEN: ${{ secrets.CSS_ENGINE_TOKEN }}
          WWISE_EMAIL: ${{ secrets.WWISE_EMAIL }}
          WWISE_PASSWORD: ${{ secrets.WWISE_PASSWORD }}
        run: |
          for name in GH_TOKEN WWISE_EMAIL WWISE_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing dependency credential: $name (GH_TOKEN comes from CSS_ENGINE_TOKEN)."
              exit 1
            fi
          done
          gh api repos/satisfactorymodding/UnrealEngine --jq '.full_name'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            wget build-essential zstd dos2unix patch msitools perl python3 \
            xvfb xauth gnupg ca-certificates winbind \
            libgtk-3-0 libnss3 libxss1 libasound2t64 libgbm1

      - name: Install prebuilt Wine 11.19
        run: bash .github/scripts/setup-ci-wine.sh

      - name: Install MSVC 17.8 and Windows SDK
        run: bash .github/scripts/setup-ci-msvc.sh

      - name: Prepare short project path
        run: |
          test ! -e "$PROJECT_ROOT"
          cp -a "$GITHUB_WORKSPACE" "$PROJECT_ROOT"
          mkdir -p "$UE_CSS_ROOT"

      - name: Download and register Linux CSS Unreal Engine
        working-directory: /tmp/cg-ue
        env:
          GH_TOKEN: ${{ secrets.CSS_ENGINE_TOKEN }}
          ENGINE_RELEASE: ${{ vars.CSS_ENGINE_RELEASE }}
        run: |
          args=(release download --repo satisfactorymodding/UnrealEngine --pattern 'UnrealEngine-CSS-Editor-Linux.tar.zst.*')
          if [ -n "$ENGINE_RELEASE" ]; then args+=("$ENGINE_RELEASE"); fi
          gh "${args[@]}"
          cat UnrealEngine-CSS-Editor-Linux.tar.zst.* | zstd -d | tar -xf -
          # Delete only downloaded archive parts, after successful extraction.
          find . -maxdepth 1 -type f -name 'UnrealEngine-CSS-Editor-Linux.tar.zst.*' -delete
          python3 - <<'PY'
          import json
          with open('Engine/Build/Build.version') as f:
              version = json.load(f)
          assert [version[k] for k in ('MajorVersion', 'MinorVersion', 'PatchVersion')] == [5, 6, 1], 'Wrong engine version'
          PY
          ./Engine/Binaries/Linux/UnrealVersionSelector -register -unattended
          df -h .

      - name: Download and integrate Wwise
        env:
          GH_TOKEN: ${{ github.token }}
          WWISE_EMAIL: ${{ secrets.WWISE_EMAIL }}
          WWISE_PASSWORD: ${{ secrets.WWISE_PASSWORD }}
        run: |
          cli="$RUNNER_TEMP/wwise-cli"
          gh release download v0.2.4 --repo mircearoata/wwise-cli --pattern wwise-cli_linux_amd64 --output "$cli"
          chmod +x "$cli"
          # Suppress signed download URLs and account authentication output.
          "$cli" download --sdk-version '2023.1.14.8770' --filter Packages=SDK \
            --filter DeploymentPlatforms=Windows_vc160 --filter DeploymentPlatforms=Windows_vc170 \
            --filter DeploymentPlatforms=Linux --filter DeploymentPlatforms= > /dev/null
          "$cli" integrate-ue --integration-version '2023.1.14.3555' \
            --project "$PROJECT_ROOT/FactoryGame.uproject" > /dev/null
          test -f "$PROJECT_ROOT/Plugins/Wwise/Wwise.uplugin"
          test -f "$PROJECT_ROOT/Plugins/WwiseNiagara/WwiseNiagara.uplugin"

      - name: Build Linux editor target
        run: |
          "$UE_CSS_ROOT/Engine/Build/BatchFiles/Linux/Build.sh" \
            FactoryEditor Linux Development "-project=$PROJECT_ROOT/FactoryGame.uproject"

      - name: Package Windows client with Wine MSVC
        run: |
          # Prevent Zen from requesting a file-descriptor limit above fs.nr_open.
          hard=$(ulimit -Hn)
          if [ "$hard" = unlimited ] || [ "$hard" -ge 1048576 ]; then
            ulimit -Sn 1048576
          else
            ulimit -Sn "$hard"
          fi
          "$UE_CSS_ROOT/Engine/Build/BatchFiles/RunUAT.sh" \
            "-ScriptsForProject=$PROJECT_ROOT/FactoryGame.uproject" PackagePlugin \
            "-project=$PROJECT_ROOT/FactoryGame.uproject" -DLCName=Cartograph \
            -merge -build -clientconfig=Shipping -serverconfig=Shipping \
            -platform=Win64 -nocompileeditor -installed
          archive="$PROJECT_ROOT/Saved/ArchivedPlugins/Cartograph"
          test -d "$archive"
          test -n "$(find "$archive" -maxdepth 1 -type f -name '*.zip' -print -quit)"

      - name: Upload packaged mod
        uses: actions/upload-artifact@v7
        with:
          name: Cartograph-Windows-Wine-${{ github.run_number }}
          path: /tmp/cg/Saved/ArchivedPlugins/Cartograph/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
